[package]
name = "br_financial"
description = "A Rust library for calculating real estate financing in Brazil, supporting SAC and Price amortization systems with insurance, admin fees, monetary correction, and i18n"
version = "0.5.0"
edition = "2024"
authors = ["Fabiano Martins <fabiano.paula.martins@gmail.com>"]
license = "MIT"
repository = "https://github.com/ofabianomartins/br_financing"

[dependencies]
anyhow = "1.0.100"
rstest = "0.26.1"
rust_decimal = { version = "1.39.0", features = ["maths"] }
rust_decimal_macros = "1.39.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
chrono = { version = "0.4", features = ["serde"] }
rust-i18n = "3"
